# AgentBoard configuration example
# Copy to ~/.agentboard/config.yml and edit.
# DO NOT commit this file with real values.

# LLM provider — uses CLI auth (your existing subscription), no API keys needed
default_provider: claude        # claude or codex

# CLI paths (must be in PATH or provide absolute path)
claude_cli_path: claude         # npm install -g @anthropic-ai/claude-code
codex_cli_path: codex           # npm install -g @openai/codex

# Optional: GitHub token for automatic PR creation
# Without this, agents still commit and push, but won't open PRs
# github_token: ghp_...

# Optional: use your own agent YAML configs (e.g. from ai-playbook)
# If not set, bundled defaults are used
# agent_config_path: ~/ai-playbook/agents/

# Heartbeat checks every N minutes — alerts if pipeline is stuck
heartbeat_interval_minutes: 30

# Stories auto-archive N days after moving to DONE
archive_after_days: 7

# Workspace directory for cloned repos during execution
workspace_base: /tmp/agentboard/workspaces

# Optional: custom database path (default: ~/.agentboard/agentboard.db)
# db_path: ~/my-project/.agentboard.db
