[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentboard"
version = "0.1.0"
description = "Story-driven multi-agent development TUI — local CLI where AI agents handle engineering and GTM work"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "AgentBoard Contributors" }]
keywords = ["ai", "agents", "tui", "kanban", "cli", "llm", "development"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Terminals",
]

dependencies = [
    "textual>=0.47.0",
    "typer>=0.9.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff==0.16.0",
    "mypy>=1.8.0",
]

[project.scripts]
agentboard = "agentboard.cli:app"

[project.urls]
Homepage = "https://github.com/agentboard/agentboard"
Repository = "https://github.com/agentboard/agentboard"
Issues = "https://github.com/agentboard/agentboard/issues"
Changelog = "https://github.com/agentboard/agentboard/releases"

[tool.hatch.build.targets.wheel]
packages = ["agentboard"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "T20", "RET", "SIM", "TID"]
ignore = [
    "ANN401",  # Any type
    "S603",    # subprocess calls (we use these intentionally)
    "S607",    # partial executable paths
    "S108",    # /tmp path in config default — intentional
    "B008",    # typer.Option() in function defaults — standard Typer pattern
    "UP042",   # StrEnum upgrade — keep str+Enum for SQLAlchemy compatibility
    "E501",    # line length — prompt strings in agents exceed 100 chars by design
    "S101",    # assert in production — used for type narrowing, not user input
    "S110",    # try/except/pass — used intentionally in agent registry loader
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]
"agentboard/migrations/**" = ["ANN"]
"agentboard/agents/defaults/**" = []  # no Python files here
"agentboard/tui/**" = ["ANN"]          # Textual widget methods often lack annotations
"agentboard/cli.py" = ["ANN"]          # Typer CLI args don't need annotations

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=agentboard --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
omit = [
    # Terminal UI is an integration boundary, not part of unit coverage.
    "agentboard/tui/*",
    # Provider clients require installed external CLIs.
    "agentboard/llm/claude_cli.py",
    "agentboard/llm/codex_cli.py",
    # Thin process and CLI boundaries are covered by integration tests.
    "agentboard/cli.py",
    "agentboard/agents/engineering_runner.py",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
