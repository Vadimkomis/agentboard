[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentboard"
version = "0.1.0"
description = "Local browser workspace for project backlogs, Sprints, approvals, and reports"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "AgentBoard Contributors" }]
keywords = ["browser", "kanban", "local-first", "project-management", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

dependencies = [
    "typer>=0.9.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "fastapi>=0.115.0,<1.0",
    "jinja2>=3.1.0,<4.0",
    "uvicorn>=0.30.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff==0.16.0",
    "mypy>=1.8.0",
    "httpx>=0.27.0",
]

[project.scripts]
agentboard = "agentboard.cli:app"

[project.urls]
Homepage = "https://github.com/agentboard/agentboard"
Repository = "https://github.com/agentboard/agentboard"
Issues = "https://github.com/agentboard/agentboard/issues"
Changelog = "https://github.com/agentboard/agentboard/releases"

[tool.hatch.build.targets.wheel]
packages = ["agentboard"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "T20", "RET", "SIM", "TID"]
ignore = [
    "ANN401",  # Any type
    "B008",    # typer.Option() in function defaults — standard Typer pattern
    "UP042",   # StrEnum upgrade — keep str+Enum for SQLAlchemy compatibility
    "E501",    # line length — templates and schema strings may exceed 100 characters
    "S101",    # assert in production — used for type narrowing, not user input
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]
"agentboard/migrations/**" = ["ANN"]
"agentboard/cli.py" = ["ANN"]  # Typer CLI args don't need annotations

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=agentboard --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
concurrency = ["thread", "greenlet"]
omit = [
    # Thin process and CLI boundaries are covered by integration tests.
    "agentboard/cli.py",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
