<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentBoard v0 Architecture</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 1180px; margin: 32px auto; padding: 0 20px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 22px; font-weight: 650; fill: var(--fg); }
  .label { font-size: 14px; font-weight: 650; fill: var(--fg); }
  .small { font-size: 12px; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1; }
  .neutral { fill: var(--neutral); }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .risk { fill: var(--risk); }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; }
  .zone-title { font-size: 13px; font-weight: 650; fill: var(--muted); }
</style>
<main>
  <svg viewBox="0 0 1140 720" role="img" aria-labelledby="title desc">
    <title id="title">AgentBoard v0 Architecture</title>
    <desc id="desc">Linux control plane connected privately to a Mac browser and worker, GitHub, and an Obsidian projection.</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/>
      </marker>
    </defs>

    <text x="30" y="34" class="title">AgentBoard v0 — Linux authority, project isolation, browser control</text>

    <path class="edge" marker-end="url(#arrow)" d="M 215 150 C 275 150, 280 150, 340 150"/>
    <path class="edge" marker-end="url(#arrow)" d="M 800 150 C 865 150, 875 150, 930 150"/>
    <path class="edge" marker-end="url(#arrow)" d="M 570 222 L 570 274"/>
    <path class="edge" marker-end="url(#arrow)" d="M 570 354 L 570 402"/>
    <path class="edge" marker-end="url(#arrow)" d="M 485 474 C 405 474, 360 474, 285 474"/>
    <path class="edge" marker-end="url(#arrow)" d="M 655 474 C 735 474, 790 474, 865 474"/>
    <path class="edge" marker-end="url(#arrow)" d="M 285 535 C 370 605, 760 605, 865 535"/>
    <path class="edge" marker-end="url(#arrow)" d="M 930 206 C 890 300, 890 365, 915 416"/>
    <path class="edge" marker-end="url(#arrow)" d="M 340 178 C 285 280, 250 335, 250 416"/>

    <rect x="20" y="70" width="250" height="180" rx="14" class="zone"/>
    <text x="38" y="94" class="zone-title">MAC — HUMAN / LATER WORKER</text>
    <rect x="55" y="116" width="160" height="68" rx="10" class="node input"/>
    <text x="135" y="144" text-anchor="middle" class="label">Browser</text>
    <text x="135" y="164" text-anchor="middle" class="small">SSH tunnel / Tailscale</text>
    <rect x="55" y="196" width="160" height="38" rx="10" class="node external"/>
    <text x="135" y="220" text-anchor="middle" class="label">Obsidian vault</text>

    <rect x="310" y="70" width="520" height="500" rx="16" class="zone"/>
    <text x="330" y="94" class="zone-title">LINUX — AUTHORITATIVE CONTROL PLANE</text>
    <rect x="340" y="116" width="460" height="106" rx="12" class="node process"/>
    <text x="570" y="145" text-anchor="middle" class="label">FastAPI + Jinja2 + HTMX</text>
    <text x="570" y="167" text-anchor="middle" class="small">Portfolio · project boards · Feature workspace · approvals</text>
    <text x="570" y="188" text-anchor="middle" class="small">Authenticated commands · CSRF · idempotency · optimistic versions</text>

    <rect x="400" y="274" width="340" height="80" rx="12" class="node process"/>
    <text x="570" y="304" text-anchor="middle" class="label">Application service + domain core</text>
    <text x="570" y="327" text-anchor="middle" class="small">Guarded state machine · project isolation · invalidation</text>

    <rect x="400" y="402" width="340" height="72" rx="12" class="node process"/>
    <text x="570" y="431" text-anchor="middle" class="label">Serial dispatcher + reconciliation</text>
    <text x="570" y="453" text-anchor="middle" class="small">One active work item per project · durable leases</text>

    <rect x="340" y="502" width="210" height="48" rx="10" class="node storage"/>
    <text x="445" y="531" text-anchor="middle" class="label">SQLite + event log</text>
    <rect x="590" y="502" width="210" height="48" rx="10" class="node storage"/>
    <text x="695" y="531" text-anchor="middle" class="label">Artifacts + evidence</text>

    <rect x="870" y="70" width="250" height="180" rx="14" class="zone"/>
    <text x="888" y="94" class="zone-title">EXTERNAL SOURCE CONTROL</text>
    <rect x="930" y="116" width="150" height="90" rx="10" class="node external"/>
    <text x="1005" y="147" text-anchor="middle" class="label">GitHub</text>
    <text x="1005" y="169" text-anchor="middle" class="small">Repos · branches · PRs</text>
    <text x="1005" y="188" text-anchor="middle" class="small">CI results</text>

    <rect x="70" y="416" width="215" height="119" rx="12" class="node external"/>
    <text x="177" y="448" text-anchor="middle" class="label">Sanitized projection</text>
    <text x="177" y="472" text-anchor="middle" class="small">Approved Markdown only</text>
    <text x="177" y="493" text-anchor="middle" class="small">Versioned through Git</text>
    <text x="177" y="514" text-anchor="middle" class="small">No DB, secrets, raw logs</text>

    <rect x="865" y="416" width="225" height="119" rx="12" class="node external"/>
    <text x="977" y="448" text-anchor="middle" class="label">Execution boundary</text>
    <text x="977" y="472" text-anchor="middle" class="small">Linux worktrees initially</text>
    <text x="977" y="493" text-anchor="middle" class="small">Mac worker later</text>
    <text x="977" y="514" text-anchor="middle" class="small">Project-scoped assignment</text>

    <rect x="310" y="610" width="520" height="78" rx="12" class="node neutral"/>
    <text x="570" y="640" text-anchor="middle" class="label">Per-project containment</text>
    <text x="570" y="663" text-anchor="middle" class="small">Project UUID scopes every Feature, artifact, event, repository, worktree, execution, and validation record</text>
  </svg>
</main>
